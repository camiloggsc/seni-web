name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, gana el ultimo y el anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Se define en Settings → Secrets and variables → Actions → Variables.
          # Sin esta variable el sitio publica igual, pero el formulario avisa
          # del fallo en vez de fingir que se envio.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}

      # OJO: no agregar public/CNAME. En despliegues por Actions el dominio
      # vive en Settings > Pages. Si el CNAME viaja en el artefacto, cada
      # despliegue lo reaplica y reinicia la emision del certificado HTTPS,
      # que se queda en bucle bad_authz sin salir nunca.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
